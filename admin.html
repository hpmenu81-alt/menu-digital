<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Menu HP103</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-orange-50 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto bg-white rounded-3xl p-5 shadow-xl">
    <h1 class="text-xl font-black uppercase text-slate-900 mb-1">Admin Menu</h1>
    <p class="text-xs font-bold text-slate-400 mb-5">Happy Puppy Panjaitan Samarinda</p>
    <div class="grid grid-cols-2 gap-2 mb-5">
  <button onclick="showTab('form')" id="tabForm" class="bg-orange-500 text-white rounded-2xl py-3 font-black text-xs uppercase">
    Tambah / Edit
  </button>
  <button onclick="showTab('list')" id="tabList" class="bg-slate-200 text-slate-700 rounded-2xl py-3 font-black text-xs uppercase">
    Kelola Menu
  </button>
</div>
    <a href="index.html" target="_blank"
class="block w-full text-center bg-slate-900 text-white rounded-2xl py-3 font-black text-xs uppercase mb-5">
  👀 Lihat Menu Customer
</a>

    <input id="edit_id" type="hidden">

    <div id="panelForm" class="space-y-3">
      <input id="nama" class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" placeholder="Nama menu">

      <input id="harga" type="number" class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" placeholder="Harga">

      <input
id="kategori"
list="kategori-list"
class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold outline-none"
placeholder="Kategori (FOOD, MINUMAN, PAKET, dll)">

<datalist id="kategori-list">
  <option value="FOOD">
  <option value="SNACK">
  <option value="HOT SNACK">
  <option value="MINUMAN">
  <option value="ROKOK">
  <option value="KOREK">
  <option value="PAKET">
</datalist>

      <textarea id="deskripsi" class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" placeholder="Deskripsi menu / isi paket / info promo"></textarea>

      <input id="foto" type="file" accept="image/*" onchange="previewFoto()" class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold">

<img id="previewFoto" class="hidden w-full h-48 object-cover rounded-2xl bg-slate-100">
<p id="fotoHint" class="hidden text-xs font-bold text-orange-600">
  Kosongkan foto jika tidak ingin mengganti foto lama.
</p>

      <label class="flex items-center gap-2 text-sm font-bold">
  <input id="best_seller" type="checkbox">
  Best Seller
</label>

<label class="flex items-center gap-2 text-sm font-bold">
  <input id="promo" type="checkbox">
  Promo
</label>
      <button onclick="simpanMenu()" id="btn-simpan" class="w-full bg-orange-500 text-white rounded-2xl py-4 font-black uppercase">
        Simpan Menu
      </button>

      <button onclick="resetForm()" class="w-full bg-slate-200 text-slate-700 rounded-2xl py-3 font-black uppercase">
        Reset Form
      </button>
    </div>

    <div id="status" class="mt-4 text-sm font-bold text-center"></div>

    <div id="panelList" class="hidden mt-6 border-t pt-5">
      <h2 class="text-lg font-black uppercase text-slate-900 mb-3">Daftar Menu</h2>

<input id="searchAdmin" oninput="loadMenu()" 
class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold outline-none mb-3" 
placeholder="Cari menu...">

<select id="filterAdmin" onchange="loadMenu()" 
class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold outline-none mb-3">
  <option value="SEMUA">Semua Menu</option>
  <option value="AKTIF">Aktif</option>
  <option value="NONAKTIF">Nonaktif</option>
  <option value="BEST">Best Seller</option>
  <option value="PROMO">Promo</option>
</select>

<div id="list-menu" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://sytpztzuohaxseqdcnwa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_uEpaY5r4PqrbW7Gw-QMumQ_wIKrP3Cg";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function uploadFoto(file, nama) {
      if (!file) return null;

      const fileExt = file.name.split(".").pop();
      const fileName = `${Date.now()}-${nama.toLowerCase().replaceAll(" ", "-")}.${fileExt}`;

      const upload = await client.storage
        .from("menu-images")
        .upload(fileName, file);

      if (upload.error) throw upload.error;

      return client.storage
        .from("menu-images")
        .getPublicUrl(fileName).data.publicUrl;
    }

    async function simpanMenu() {
      const btn = document.getElementById("btn-simpan");
      const status = document.getElementById("status");

      const editId = document.getElementById("edit_id").value;
      const nama = document.getElementById("nama").value.trim();
      const harga = parseInt(document.getElementById("harga").value);
      const kategori = document.getElementById("kategori").value;
      const deskripsi = document.getElementById("deskripsi").value.trim();
      const file = document.getElementById("foto").files[0];
      const bestSeller = document.getElementById("best_seller").checked;
      const promo = document.getElementById("promo").checked;

      if (!nama || !harga || !kategori) {
        status.innerText = "Nama, harga, dan kategori wajib diisi.";
        status.className = "mt-4 text-sm font-bold text-center text-red-500";
        return;
      }

      if (!editId && !file) {
        status.innerText = "Foto wajib diisi untuk menu baru.";
        status.className = "mt-4 text-sm font-bold text-center text-red-500";
        return;
      }

      btn.disabled = true;
      btn.innerText = editId ? "Mengupdate..." : "Menyimpan...";
      status.innerText = "";

      try {
        let fotoUrl = await uploadFoto(file, nama);

        const payload = {
          nama,
          harga,
          kategori,
          deskripsi,
          aktif: true,
          best_seller: bestSeller,
promo: promo
        };

        if (fotoUrl) payload.foto_url = fotoUrl;

        let result;

        if (editId) {
          result = await client
            .from("menus")
            .update(payload)
            .eq("id", editId);
        } else {
          result = await client
            .from("menus")
            .insert(payload);
        }

        if (result.error) throw result.error;

        status.innerText = editId ? "Menu berhasil diupdate." : "Menu berhasil disimpan.";
        status.className = "mt-4 text-sm font-bold text-center text-green-600";

        resetForm();
        loadMenu();

      } catch (err) {
        console.error(err);
        status.innerText = "Gagal: " + err.message;
        status.className = "mt-4 text-sm font-bold text-center text-red-500";
      }

      btn.disabled = false;
      btn.innerText = "Simpan Menu";
    }

    async function loadMenu() {
      const list = document.getElementById("list-menu");
      list.innerHTML = `<p class="text-sm font-bold text-slate-400">Memuat menu...</p>`;

      const { data, error } = await client
        .from("menus")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        list.innerHTML = `<p class="text-sm font-bold text-red-500">Gagal memuat menu: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = `<p class="text-sm font-bold text-slate-400">Belum ada menu.</p>`;
        return;
      }
      const keyword = document.getElementById("searchAdmin")?.value.toLowerCase() || "";
const filter = document.getElementById("filterAdmin")?.value || "SEMUA";

let hasil = data.filter(m => {
  const cocokNama = (m.nama || "").toLowerCase().includes(keyword);
  const cocokKategori = (m.kategori || "").toLowerCase().includes(keyword);

  const cocokSearch = cocokNama || cocokKategori;

  if (filter === "AKTIF") return cocokSearch && m.aktif;
  if (filter === "NONAKTIF") return cocokSearch && !m.aktif;
  if (filter === "BEST") return cocokSearch && m.best_seller;
  if (filter === "PROMO") return cocokSearch && m.promo;

  return cocokSearch;
});

      list.innerHTML = hasil.map(m => `
        <div class="bg-slate-50 rounded-2xl p-3 border ${m.aktif ? 'border-slate-100' : 'border-red-200 opacity-60'}">
          <div class="flex gap-3">
            <img src="${m.foto_url || 'https://placehold.co/100x100?text=Menu'}" class="w-16 h-16 rounded-xl object-cover bg-slate-200">
            <div class="flex-1 min-w-0">
              <p class="font-black text-sm text-slate-900 uppercase truncate">${m.nama}</p>
              <p class="text-xs font-bold text-orange-600">Rp ${Number(m.harga).toLocaleString('id-ID')}</p>
              <p class="text-[10px] font-black text-slate-400 uppercase">${m.kategori}</p>
              <div class="flex gap-2 mt-1 flex-wrap">

<span class="text-[10px] font-black px-2 py-1 rounded-full
${m.aktif
 ? 'bg-green-100 text-green-700'
 : 'bg-red-100 text-red-700'}">

${m.aktif ? '🟢 AKTIF' : '🔴 NONAKTIF'}

</span>

${m.best_seller ? `
<span class="text-[10px] font-black px-2 py-1 rounded-full bg-yellow-100 text-yellow-700">
⭐ BEST SELLER
</span>
` : ''}
${m.promo ? `
<span class="text-[10px] font-black px-2 py-1 rounded-full bg-orange-100 text-orange-700">
🔥 PROMO
</span>
` : ''}

</div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-3">
            <button onclick='editMenu(${JSON.stringify(m)})' class="bg-blue-500 text-white rounded-xl py-2 text-[10px] font-black uppercase">Edit</button>

            <button onclick="toggleAktif('${m.id}', ${!m.aktif})" 
class="${m.aktif ? 'bg-red-500' : 'bg-green-500'} text-white rounded-xl py-2 text-[10px] font-black uppercase">
  ${m.aktif ? 'NONAKTIFKAN' : 'AKTIFKAN'}
</button>
            <button onclick="toggleBestSeller('${m.id}', ${!m.best_seller})" 
class="${m.best_seller ? 'bg-yellow-500 text-slate-900' : 'bg-slate-300 text-slate-700'} rounded-xl py-2 text-[10px] font-black uppercase">
  ${m.best_seller ? 'HAPUS BEST SELLER' : 'JADIKAN BEST'}
</button>
<button onclick="togglePromo('${m.id}', ${!m.promo})"
class="${m.promo ? 'bg-orange-500 text-white' : 'bg-slate-300 text-slate-700'} rounded-xl py-2 text-[10px] font-black uppercase">
  ${m.promo ? 'HAPUS PROMO' : 'JADIKAN PROMO'}
</button>
          </div>
        </div>
      `).join("");
    }

    function editMenu(menu) {
      document.getElementById("edit_id").value = menu.id;
      document.getElementById("nama").value = menu.nama || "";
      document.getElementById("harga").value = menu.harga || "";
      document.getElementById("kategori").value = menu.kategori || "FOOD";
      document.getElementById("deskripsi").value = menu.deskripsi || "";
      document.getElementById("best_seller").checked = menu.best_seller || false;
      document.getElementById("fotoHint").classList.remove("hidden");
      document.getElementById("promo").checked = menu.promo || false;

      if (menu.foto_url) {
  document.getElementById("previewFoto").src = menu.foto_url;
  document.getElementById("previewFoto").classList.remove("hidden");
}


      document.getElementById("btn-simpan").innerText = "Update Menu";
      showTab("form");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    
    async function toggleAktif(id, value) {
      const { error } = await client
        .from("menus")
        .update({ aktif: value })
        .eq("id", id);

      if (error) {
        alert("Gagal update status: " + error.message);
        return;
      }

      loadMenu();
    }

    async function toggleBestSeller(id, value) {
      const { error } = await client
        .from("menus")
        .update({ best_seller: value })
        .eq("id", id);

      if (error) {
        alert("Gagal update best seller: " + error.message);
        return;
      }

      loadMenu();
    }
    async function togglePromo(id, value) {
  const { error } = await client
    .from("menus")
    .update({ promo: value })
    .eq("id", id);

  if (error) {
    alert("Gagal update promo: " + error.message);
    return;
  }

  loadMenu();
}
    function previewFoto() {
  const file = document.getElementById("foto").files[0];
  const preview = document.getElementById("previewFoto");

  if (!file) {
    preview.classList.add("hidden");
    preview.src = "";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.classList.remove("hidden");
}

    function resetForm() {
      document.getElementById("edit_id").value = "";
      document.getElementById("nama").value = "";
      document.getElementById("harga").value = "";
      document.getElementById("kategori").value = "";
      document.getElementById("deskripsi").value = "";
      document.getElementById("foto").value = "";
      document.getElementById("best_seller").checked = false;
      document.getElementById("btn-simpan").innerText = "Simpan Menu";
      document.getElementById("fotoHint").classList.add("hidden");
      document.getElementById("previewFoto").classList.add("hidden");
      document.getElementById("previewFoto").src = "";
      document.getElementById("promo").checked = false;
    }
    function showTab(tab) {
  const panelForm = document.getElementById("panelForm");
  const panelList = document.getElementById("panelList");
  const tabForm = document.getElementById("tabForm");
  const tabList = document.getElementById("tabList");

  if (tab === "form") {
    panelForm.classList.remove("hidden");
    panelList.classList.add("hidden");

    tabForm.className = "bg-orange-500 text-white rounded-2xl py-3 font-black text-xs uppercase";
    tabList.className = "bg-slate-200 text-slate-700 rounded-2xl py-3 font-black text-xs uppercase";
  } else {
    panelForm.classList.add("hidden");
    panelList.classList.remove("hidden");

    tabForm.className = "bg-slate-200 text-slate-700 rounded-2xl py-3 font-black text-xs uppercase";
    tabList.className = "bg-orange-500 text-white rounded-2xl py-3 font-black text-xs uppercase";

    loadMenu();
  }
}

    loadMenu();
  </script>
</body>
</html>
